name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo check --target wasm32-unknown-unknown

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install component tooling
        run: cargo install wasm-tools --locked
      - name: Build plugin package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p target/bkmqb
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/bkmqb_plugin_github_issue.wasm \
            -o target/bkmqb/component.wasm
          plugin_id="$(sed -n 's/^id = "\(.*\)"/\1/p' plugin.toml | head -n1)"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' plugin.toml | head -n1)"
          package="target/bkmqb/${plugin_id}-${version}.bkm-plugin"
          zip -X -j "$package" plugin.toml target/bkmqb/component.wasm config.schema.json README.md
          sha256sum "$package" > "${package}.sha256"
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" target/bkmqb/*.bkm-plugin target/bkmqb/*.sha256 --clobber
